/* ---------- анимация шага ---------- */
let walkAnim=null;
const REDUCED_MOTION=(()=>{ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } })();
function camFor(r,c){ return {r:Math.max(0,Math.min(ROWS-VIEW_ROWS,r-Math.floor(VIEW_ROWS/2))), c:Math.max(0,Math.min(COLS-VIEW_COLS,c-Math.floor(VIEW_COLS/2)))}; }
function startHeroWalk(path,done){
  if(gfxMode!=='new'||REDUCED_MOTION||path.length<2||view!=='map'){ done(); return; }
  const T=TILE_PX, dpr=Math.min(2,window.devicePixelRatio||1);
  ensureGfxCache(T,dpr);
  const cams=path.map(p=>camFor(p.r,p.c));
  const R0=Math.min(...cams.map(k=>k.r)), C0=Math.min(...cams.map(k=>k.c));
  const nR=Math.max(...cams.map(k=>k.r))-R0+VIEW_ROWS, nC=Math.max(...cams.map(k=>k.c))-C0+VIEW_COLS;
  const off=document.createElement('canvas'); off.width=Math.ceil(nC*T*dpr); off.height=Math.ceil(nR*T*dpr);
  const og=off.getContext('2d'); og.setTransform(dpr,0,0,dpr,0,0);
  drawWorld(og,T,dpr,R0,C0,nR,nC,{hero:false});
  const stepMs=Math.max(55,Math.min(110,900/(path.length-1)));
  walkAnim={path,off,R0,C0,dpr,stepMs,t0:performance.now(),done};
  requestAnimationFrame(walkFrame);
}
function walkFrame(now){
  const a=walkAnim; if(!a) return;
  const T=TILE_PX, W=VIEW_COLS*T, H=VIEW_ROWS*T, screenDpr=Math.min(3,window.devicePixelRatio||1);
  const prog=Math.max(0,Math.min(a.path.length-1,(now-a.t0)/a.stepMs)), i=Math.floor(prog), f=prog-i;
  const p0=a.path[i], p1=a.path[Math.min(i+1,a.path.length-1)], e=f<0.5?2*f*f:1-2*(1-f)*(1-f);
  const hr=p0.r+(p1.r-p0.r)*e, hc=p0.c+(p1.c-p0.c)*e;
  const camR=Math.max(0,Math.min(ROWS-VIEW_ROWS,hr-Math.floor(VIEW_ROWS/2))), camC=Math.max(0,Math.min(COLS-VIEW_COLS,hc-Math.floor(VIEW_COLS/2)));
  const cv=mapCanvasEl(W,H,screenDpr), g=cv.getContext('2d');
  g.setTransform(screenDpr,0,0,screenDpr,0,0); g.clearRect(0,0,W,H);
  g.drawImage(a.off,(camC-a.C0)*T*a.dpr,(camR-a.R0)*T*a.dpr,W*a.dpr,H*a.dpr,0,0,W,H);
  const fs=Math.round(T*0.64); g.textAlign='center'; g.textBaseline='middle'; g.font=`${fs}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  const onWater=terrAt(Math.round(hr),Math.round(hc))==='w';
  const bob=onWater?Math.sin(prog*Math.PI*2)*T*0.025:-Math.abs(Math.sin(f*Math.PI))*T*0.08;
  drawObject(g,onWater?{k:'ship'}:heroTok(),(hc-camC)*T,(hr-camR)*T+bob,T,screenDpr);
  drawAtmosphere(g,W,H);
  if(prog>=a.path.length-1){ walkAnim=null; const done=a.done; renderMap(); done(); return; }
  requestAnimationFrame(walkFrame);
}
/* Путь героя по карте Дейкстры: от цели назад к герою. Возвращает клетки от старта до цели. */
function heroPath(dist,r,c){
  const out=[{r,c}]; let cr=r, cc=c, guard=0;
  const cost=(rr,cc2)=>tch(rr,cc2)==='w'?(onShip?2:Infinity):TERRAIN[tch(rr,cc2)].cost;
  while(!(cr===hero.row&&cc===hero.col) && guard++<400){
    const here=dist[key(cr,cc)], step=cost(cr,cc); let moved=false;
    for(const [nr,nc] of [[cr-1,cc],[cr+1,cc],[cr,cc-1],[cr,cc+1]]){
      const d=dist[key(nr,nc)];
      if(d!==undefined && d+step===here){ cr=nr; cc=nc; out.push({r:cr,c:cc}); moved=true; break; }
    }
    if(!moved) break;
  }
  return out.reverse();
}

/* ================= ПОРУЧЕНИЯ ГОРОДОВ =================
   В каждом городе — одно поручение за раз: охота (разбить логово), письмо (доставить в другой город земли),
   клад (найти тайник ❓). Награда выдаётся сразу по выполнении. Одновременно не больше 3 активных.
   После выполнения город даёт новое поручение через 2 дня. Цели отмечены ❗ на карте и кольцом на мини-карте. */
const MAX_QUESTS=3;
function activeQuests(){ return allPois().filter(p=>p.type==='city'&&p.quest&&p.quest.status==='active').map(p=>p.quest); }
function questTargetPos(q){
  if(q.type==='hunt'||q.type==='treasure') return {r:q.tr,c:q.tc};
  if(q.type==='courier'){ const w=worlds[q.cont]; const d=w&&(w===worlds[curCont]?pois:w.pois).find(p=>p.type==='city'&&p.name===q.dest); return d?{r:d.r,c:d.c}:null; }
  return null;
}
function questTargetAt(r,c){
  if(questState==='active'){ const n=questLair(); if(n&&n.r===r&&n.c===c&&!visited[key(n.r,n.c)+':lair']) return true; }
  return activeQuests().some(q=>{ if(q.cont!==curCont) return false; const t=questTargetPos(q); return t&&t.r===r&&t.c===c; }); }
function drawQuestBadge(g,x,y,T){
  const cx=x+T*0.8, cy=y+T*0.18, rr=Math.max(5,T*0.17);
  g.fillStyle='#ffd34d'; g.beginPath(); g.arc(cx,cy,rr,0,Math.PI*2); g.fill(); g.strokeStyle='#3a2a10'; g.lineWidth=1.5; g.stroke();
  g.fillStyle='#3a2a10'; g.font=`bold ${Math.round(rr*1.4)}px sans-serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText('!',cx,cy+0.5);
}
function makeQuest(city){
  const lairs=pois.filter(p=>p.type==='lair'&&poiAt(p.r,p.c)===p&&!activeQuests().some(q=>q.type==='hunt'&&q.cont===curCont&&q.tr===p.r&&q.tc===p.c));
  const others=pois.filter(p=>p.type==='city'&&p!==city);
  const types=[]; if(lairs.length) types.push('hunt','hunt'); if(others.length) types.push('courier'); types.push('treasure');
  const type=types[Math.floor(Math.random()*types.length)];
  if(type==='hunt'){
    lairs.sort((a,b)=>chebyshev(a,city)-chebyshev(b,city)); const t=lairs[Math.floor(Math.random()*Math.min(4,lairs.length))];
    const pow=power(t.enemies,false);
    return {type,cont:curCont,city:city.name,tr:t.r,tc:t.c,target:t.name,gold:Math.round(pow*0.9+60),exp:Math.round(pow/4)+15,
      text:`Разбейте «${t.name}» — они разоряют окрестности ${city.name}.`};
  }
  if(type==='courier'){
    const d=others[Math.floor(Math.random()*others.length)], far=chebyshev(d,city);
    return {type,cont:curCont,city:city.name,dest:d.name,gold:Math.round((40+far*3)*goldMult()),exp:20,
      text:`Доставьте письмо градоначальнику в город ${d.name}.`};
  }
  // клад: проходимая пустая клетка в 10–25 клетках от города
  let spot=null;
  for(let i=0;i<300&&!spot;i++){ const r=city.r+Math.round((Math.random()-0.5)*50), c=city.c+Math.round((Math.random()-0.5)*50);
    if(r<2||c<2||r>=ROWS-2||c>=COLS-2) continue; const d=chebyshev({r,c},city); if(d<10||d>25) continue;
    if(['g','d','s','r'].includes(terrainGrid[r][c])&&!pois.some(q=>q.r===r&&q.c===c)) spot={r,c}; }
  if(!spot) return null;
  pois.push({r:spot.r,c:spot.c,type:'qspot',name:'Тайник',emoji:'❓',questCity:city.name,hidden:true});
  return {type:'treasure',cont:curCont,city:city.name,tr:spot.r,tc:spot.c,gold:Math.round((120+Math.random()*120)*goldMult()),exp:25,item:Math.random()<0.3,
    text:`По старой карте горожан где-то неподалёку зарыт клад. Отыщите тайник ❓.`};
}
function cityQuestHtml(p){
  if(p.type!=='city') return '';
  if((!p.quest||p.quest.status==='done') && (p.questReady||0)<=day){ const q=makeQuest(p); if(q){ q.status='offered'; p.quest=q; } }
  const q=p.quest;
  let body='';
  if(!q||q.status==='done') body=`<div class="armyline">Новых поручений пока нет — загляните через ${Math.max(1,(p.questReady||0)-day)} дн.</div>`;
  else if(q.status==='offered'){
    const full=activeQuests().length>=MAX_QUESTS;
    body=`<div class="armyline" style="color:var(--text)">${q.text}</div><div class="armyline">Награда: ${q.gold}💰, ${q.exp} опыта${q.item?', возможно — снаряжение':''}</div>
      ${full?`<div class="armyline" style="color:var(--bad)">У вас уже ${MAX_QUESTS} поручения — сначала выполните одно.</div>`:`<button onclick="acceptQuest()">Взяться</button>`}`;
  } else body=`<div class="armyline" style="color:var(--text)">${q.text}</div><div class="armyline" style="color:var(--accent)">Выполняется — цель отмечена ❗ на карте и кольцом на мини-карте 🧭.</div>`;
  return `<div class="cityCard"><h2>📜 Поручение</h2>${body}</div>`;
}
function acceptQuest(){
  const p=curCity; if(!p||!p.quest||p.quest.status!=='offered'||activeQuests().length>=MAX_QUESTS) return;
  p.quest.status='active';
  if(p.quest.type==='treasure'){ const s=pois.find(x=>x.type==='qspot'&&x.r===p.quest.tr&&x.c===p.quest.tc); if(s) s.hidden=false; }
  const t=questTargetPos(p.quest); if(t) revealAround(t.r,t.c,2);
  track('quest_accept',{type:p.quest.type}); renderCity('📜 Поручение принято.');
}
function completeQuest(q,where){
  const city=allPois().find(p=>p.type==='city'&&p.quest===q); if(!city) return '';
  q.status='done'; city.questReady=day+2;
  gold+=q.gold; heroExp+=q.exp; let extra='';
  if(q.item){ const lo=Math.max(1,contTier()), hi=Math.min(5,contTier()+1);
    const pool=Object.keys(ITEMS).filter(id=>ITEMS[id].tier>=lo&&ITEMS[id].tier<=hi&&!inventory.includes(id)&&!Object.values(equipment).includes(id));
    if(pool.length){ const id=pool[Math.floor(Math.random()*pool.length)]; inventory.push(id); extra=` и ${ITEMS[id].emoji} ${ITEMS[id].name}`; } }
  checkLevelUp(); updateHud(); stats.questsDone=(stats.questsDone||0)+1; track('quest_done',{type:q.type});
  return `📜 Поручение города ${q.city} выполнено${where?' — '+where:''}! +${q.gold}💰, +${q.exp} опыта${extra}.`;
}
function questOnLairCleared(lair){
  const q=activeQuests().find(q=>q.type==='hunt'&&q.cont===curCont&&q.tr===lair.r&&q.tc===lair.c);
  return q?completeQuest(q,`«${lair.name}» больше не опасны`):'';
}
function openQuestLog(){
  const qs=activeQuests();
  const list=qs.length?qs.map(q=>`<div class="row" style="display:block;"><b>${CONTINENTS[q.cont].emoji} ${q.city}</b><div class="armyline">${q.text}</div><div class="armyline">Награда: ${q.gold}💰, ${q.exp} опыта</div></div>`).join(''):'<div class="armyline">Активных поручений нет. Их дают в городах.</div>';
  openModal(`<h2>📜 Поручения (${qs.length}/${MAX_QUESTS})</h2>${list}<button class="secondary" style="margin-top:12px;width:100%;" onclick="closeModal()">Закрыть</button>`);
}

/* ================= КАРТА ПУТИ (части карты) =================
   Части карты складываются в картинку: следующая земля в виде старинной карты с маршрутом от края к её пристани.
   Каждый захваченный замок открывает одну часть (порядок частей у каждой земли свой), последнюю хранит Хозяин Земли.
   Когда собраны все 8 — путь открыт. Для этого следующую землю генерируем заранее, не трогая текущую. */
function ensureWorldPreview(i){
  if(worlds[i]) return worlds[i];
  stashWorld();
  const w=generateWorld(i); worlds[i]=w;
  const c=worlds[curCont]; ({terrainGrid,pois,sorcerer,CITY1,visited,mapPieces,landComplete,questState}=c); fog=c.fog||null;
  return w;
}
function pieceOrder(){ const rng=mulberry32(worldSeed+curCont*31+7); const a=[...Array(TOTAL_PIECES).keys()]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function openPieces(justGot){
  if(view==='battle') return;
  const isLast=curCont>=CONTINENTS.length-1, target=isLast?curCont:curCont+1;
  const w=isLast?(stashWorld(),worlds[curCont]):ensureWorldPreview(target);
  const PC=4, PR=TOTAL_PIECES/PC, W=360, H=270, sc=W/COLS, cv=document.createElement('canvas'); cv.width=W*2; cv.height=H*2; cv.style.width='100%'; cv.style.borderRadius='8px';
  const g=cv.getContext('2d'); g.scale(2,2);
  const sep={w:'#7d8a86',g:'#d6c393',d:'#e6d4a3',s:'#b7a67a',f:'#9c8a5c',m:'#8f7d61',r:'#c4a776'};
  g.fillStyle='#e9d9ae'; g.fillRect(0,0,W,H);
  const grid=w.terrainGrid;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ g.fillStyle=sep[grid[r][c]]||sep.g; g.fillRect(c*sc,r*(H/ROWS),sc+0.6,H/ROWS+0.6); }
  // старение: пятна и рамка
  const rng=mulberry32(target*99+3); for(let i=0;i<40;i++){ g.fillStyle=`rgba(120,90,50,${0.04+rng()*0.06})`; g.beginPath(); g.arc(rng()*W,rng()*H,4+rng()*18,0,Math.PI*2); g.fill(); }
  (w.pois||[]).forEach(p=>{ const x=p.c*sc, y=p.r*(H/ROWS);
    if(p.type==='city'){ g.fillStyle='#5a3a1a'; g.fillRect(x-2.5,y-2.5,5,5); }
    if(p.type==='castle'||p.type==='governor'){ g.fillStyle='#8a2a1a'; g.beginPath(); g.moveTo(x,y-4); g.lineTo(x+4,y+3); g.lineTo(x-4,y+3); g.closePath(); g.fill(); } });
  if(!isLast&&w.arrival){ const ax=w.arrival.c*sc, ay=w.arrival.r*(H/ROWS);
    g.strokeStyle='#a3271d'; g.lineWidth=2; g.setLineDash([6,5]); g.beginPath(); g.moveTo(0,H*0.85); g.quadraticCurveTo(W*0.25,H*0.95,ax,ay); g.stroke(); g.setLineDash([]);
    g.lineWidth=3; g.beginPath(); g.moveTo(ax-6,ay-6); g.lineTo(ax+6,ay+6); g.moveTo(ax+6,ay-6); g.lineTo(ax-6,ay+6); g.stroke(); }
  g.fillStyle='#5a3a1a'; g.font='bold 15px Georgia,serif'; g.textAlign='center'; g.fillText(CONTINENTS[target].name,W/2,20);
  // части
  const order=pieceOrder(), got=Math.min(TOTAL_PIECES,mapPieces), open=new Set(order.slice(0,got)), fresh=justGot&&got>0?order[got-1]:-1;
  const pw=W/PC, ph=H/PR;
  for(let i=0;i<TOTAL_PIECES;i++){ const x=(i%PC)*pw, y=Math.floor(i/PC)*ph;
    if(!open.has(i)){ g.fillStyle='#3b2e20'; g.fillRect(x,y,pw,ph); g.fillStyle='rgba(255,230,180,0.35)'; g.font='bold 30px Georgia,serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('?',x+pw/2,y+ph/2); g.textBaseline='alphabetic'; } }
  // швы-пазлы
  g.strokeStyle='rgba(60,40,20,0.75)'; g.lineWidth=1.5;
  // вертикальные швы: выступ вправо или влево; горизонтальные — вверх или вниз
  for(let cIdx=1;cIdx<PC;cIdx++){ const x=cIdx*pw; for(let rIdx=0;rIdx<PR;rIdx++){ const y0=rIdx*ph, R=0.12*ph, left=(cIdx+rIdx)%2===0;
    g.beginPath(); g.moveTo(x,y0); g.lineTo(x,y0+ph/2-R); g.arc(x,y0+ph/2,R,-Math.PI/2,Math.PI/2,left); g.lineTo(x,y0+ph); g.stroke(); } }
  for(let rIdx=1;rIdx<PR;rIdx++){ const y=rIdx*ph; for(let cIdx=0;cIdx<PC;cIdx++){ const x0=cIdx*pw, R=0.12*pw, down=cIdx%2===0;
    g.beginPath(); g.moveTo(x0,y); g.lineTo(x0+pw/2-R,y); g.arc(x0+pw/2,y,R,Math.PI,0,down); g.lineTo(x0+pw,y); g.stroke(); } }
  if(fresh>=0){ const x=(fresh%PC)*pw, y=Math.floor(fresh/PC)*ph; g.strokeStyle='#ffd34d'; g.lineWidth=4; g.strokeRect(x+2,y+2,pw-4,ph-4); }
  g.strokeStyle='#5a3a1a'; g.lineWidth=3; g.strokeRect(1.5,1.5,W-3,H-3);
  const title=isLast?`🗺️ Карта земли ${CONTINENTS[curCont].emoji} ${CONTINENTS[curCont].name}`:`🗺️ Карта пути в ${CONTINENTS[target].emoji} ${CONTINENTS[target].name}`;
  const note=got>=TOTAL_PIECES?(isLast?'Карта собрана — земля покорена.':'<b>Путь открыт!</b> Отплывайте из любой пристани (нужен корабль).')
    :`Собрано <b>${got}/${TOTAL_PIECES}</b>. Каждый захваченный замок открывает часть карты, последнюю хранит Хозяин Земли.`;
  openModal(`<h2>${justGot?'🧩 Найдена часть карты!':title}</h2>${justGot?`<div class="modalNote">${title}</div>`:''}<div class="modalNote">${note}</div>
    <div id="pieceSlot" style="margin-top:8px;"></div><button class="secondary" style="margin-top:12px;width:100%;" onclick="closeModal()">Закрыть</button>`);
  document.getElementById('pieceSlot').appendChild(cv);
}

/* ================= SAVE / LOAD =================
   Снимок всего состояния в JSON. Рельеф каждой земли — RLE-строкой (4800 клеток → ~1–2 тыс. символов).
   Хранилища:
   • Telegram CloudStorage — когда игра открыта внутри Telegram (сохранение привязано к аккаунту, переживает смену телефона).
     Лимит 4096 символов на значение → режем на куски; пишем в чередующиеся слоты A/B, мету — последней,
     чтобы оборванная запись не испортила прошлое сохранение.
   • localStorage — всегда, как быстрый локальный кэш; вне Telegram (браузер, будущий Android WebView) — основное.
   При загрузке берётся более свежее из двух по savedAt. Во время боя сохранение не пишется.
   Когда пишется:
   • обычный режим — автосохранение в начале каждого дня и при плавании в другую землю, плюс кнопка «Сохранить».
     Неудачный эпизод можно переиграть кнопкой «Загрузить».
   • жёсткий режим — непрерывно после каждого действия и при сворачивании приложения: переиграть ничего нельзя. */
const SAVE_VERSION=1, SAVE_KEY='morveyn_save_v1', CLOUD_PREFIX='mv1', CLOUD_CHUNK=4000;
const TG=(window.Telegram&&window.Telegram.WebApp)||null;
const CLOUD_OK=!!(TG && TG.initData && TG.CloudStorage && (!TG.isVersionAtLeast || TG.isVersionAtLeast('6.9')));
if(TG && TG.initData){ try{ TG.ready(); TG.expand(); }catch(e){} }

function rleEncode(grid){
  let out='', prev=null, n=0;
  const flush=()=>{ if(prev!==null) out+=(n>1?n:'')+prev; };
  for(const row of grid) for(const ch of row){ if(ch===prev) n++; else { flush(); prev=ch; n=1; } }
  flush(); return out;
}
function rleDecode(str){
  const flat=[]; let num='';
  for(const ch of str){ if(ch>='0'&&ch<='9') num+=ch; else { const n=num?parseInt(num,10):1; for(let i=0;i<n;i++) flat.push(ch); num=''; } }
  const grid=[]; for(let r=0;r<ROWS;r++) grid.push(flat.slice(r*COLS,(r+1)*COLS));
  return grid;
}
function serializeGame(){
  stashWorld(); tickPlaytime();
  return JSON.stringify({
    v:SAVE_VERSION, savedAt:Date.now(), worldSeed, curCont, unlocked,
    worlds:worlds.map(w=>w?{terrain:rleEncode(w.terrainGrid),fog:fogEncode(w.fog),pois:w.pois,sorcerer:w.sorcerer,CITY1:w.CITY1,visited:w.visited,
      mapPieces:w.mapPieces,landComplete:w.landComplete,questState:w.questState,arrival:w.arrival}:null),
    hero, gold, day, week, movesLeft, hasShip, onShip, shipPos, lastWaterPos, bonusLeadership,
    heroLevel, heroExp, heroMagicPower, quasiExpireWeek, quasiBonus,
    equipment, inventory, army, spellCharges, workers, hardMode, gameOverPermanent, gameOverReason,
    ritualItems, ritualGranted, ritualSetDone, governorWage, stats, heroClass
  });
}
function restoreGame(json){
  let d; try{ d=JSON.parse(json); }catch(e){ return false; }
  if(!d || d.v!==SAVE_VERSION || !Array.isArray(d.worlds) || !d.worlds[d.curCont]) return false;
  worldSeed=d.worldSeed; unlocked=d.unlocked;
  worlds=d.worlds.map(w=>w?{terrainGrid:rleDecode(w.terrain),fog:fogDecode(w.fog),pois:w.pois,sorcerer:w.sorcerer,CITY1:w.CITY1,visited:w.visited||{},
    mapPieces:w.mapPieces,landComplete:w.landComplete,questState:w.questState,arrival:w.arrival}:null);
  curCont=d.curCont;
  // старые сохранения: у городов ещё нет ассортимента — раздаём его (детерминированно от сида и номера земли)
  worlds.forEach((w,i)=>{ if(w && w.pois.some(p=>p.type==='city'&&!p.shop)) assignShops(w.pois,CONTINENTS[i].tier,mulberry32((d.worldSeed||1)+i*104729)); });
  // предметы, которых больше нет в каталоге, убираем
  if(Array.isArray(d.inventory)) d.inventory=d.inventory.filter(id=>ITEMS[id]);
  if(d.equipment) Object.keys(d.equipment).forEach(sl=>{ if(d.equipment[sl]&&!ITEMS[d.equipment[sl]]) d.equipment[sl]=null; });
  // подключаем текущую землю напрямую (без stashWorld — иначе затрём загруженное пустыми глобалами)
  ({terrainGrid,pois,sorcerer,CITY1,visited,mapPieces,landComplete,questState}=worlds[curCont]); fog=worlds[curCont].fog||null;
  ({hero,gold,day,week,movesLeft,hasShip,onShip,shipPos,lastWaterPos,bonusLeadership,heroLevel,heroExp,heroMagicPower,
    quasiExpireWeek,quasiBonus,equipment,inventory,army,spellCharges,workers,hardMode,gameOverPermanent,ritualItems,governorWage}=d);
  gameOverReason=d.gameOverReason||'';
  heroClass=HERO_CLASSES[d.heroClass]?d.heroClass:'classic';
  // старые сохранения не знали о бонусах ритуальных предметов — выдаём положенное за уже найденные
  ritualGranted=typeof d.ritualGranted==='number'?d.ritualGranted:0; ritualSetDone=!!d.ritualSetDone;
  applyRitualBonuses();
  stats=Object.assign(freshStats(),d.stats||{});
  lastGoldSeen=gold; lastTick=Date.now();
  return true;
}

/* Две ячейки: 'auto' (утро, плавание, новая игра; в жёстком режиме — всё подряд) и 'manual' (кнопка «Сохранить»).
   Снимок состояния делается В МОМЕНТ сохранения и уже готовой строкой уходит и на устройство, и в облако —
   медленная запись в облако Telegram больше не может подменить его более поздним состоянием. */
const SLOT_LOCAL={auto:SAVE_KEY, manual:SAVE_KEY+'_manual'};
const SLOT_CLOUD={auto:CLOUD_PREFIX, manual:CLOUD_PREFIX+'m'};
const LocalStore={
  save(slot,str){ try{ localStorage.setItem(SLOT_LOCAL[slot],str); return true; }catch(e){ return false; } },
  load(slot){ try{ return localStorage.getItem(SLOT_LOCAL[slot]); }catch(e){ return null; } },
  clear(slot){ try{ localStorage.removeItem(SLOT_LOCAL[slot]); }catch(e){} }
};
function makeCloudStore(prefix){ return {
  slot:null, busy:false, pending:null,
  call(fn,...args){ return new Promise((res,rej)=>{ try{ TG.CloudStorage[fn](...args,(err,val)=>err?rej(err):res(val)); }catch(e){ rej(e); } }); },
  async write(str){
    if(this.slot===null){ try{ const m=JSON.parse(await this.call('getItem',prefix+'_meta')||'null'); this.slot=m?m.slot:'b'; }catch(e){ this.slot='b'; } }
    const slot=this.slot==='a'?'b':'a', n=Math.ceil(str.length/CLOUD_CHUNK);
    await Promise.all(Array.from({length:n},(_,i)=>this.call('setItem',`${prefix}_${slot}${i}`,str.slice(i*CLOUD_CHUNK,(i+1)*CLOUD_CHUNK))));
    await this.call('setItem',prefix+'_meta',JSON.stringify({slot,n,len:str.length}));
    this.slot=slot;
  },
  // очередь: пока идёт запись, новый снимок ждёт; ждёт только самый свежий, но это всегда готовая строка, а не «текущее состояние»
  async save(str){
    if(this.busy){ this.pending=str; return; }
    this.busy=true;
    try{ await this.write(str); setSaveBadge(`☁️ ${lastSaveLabel||'✓'}`); }catch(e){ setSaveBadge('☁️✗'); }
    this.busy=false;
    if(this.pending!==null){ const next=this.pending; this.pending=null; this.save(next); }
  },
  async clear(){ this.pending=null; try{ await this.call('setItem',prefix+'_meta',''); }catch(e){} },
  async load(){
    const m=JSON.parse(await this.call('getItem',prefix+'_meta')||'null'); if(!m) return null;
    const keys=Array.from({length:m.n},(_,i)=>`${prefix}_${m.slot}${i}`);
    const vals=await this.call('getItems',keys);
    const str=keys.map(k=>vals[k]||'').join('');
    this.slot=m.slot;
    return str.length===m.len?str:null;
  }
}; }
const CloudSlots={auto:makeCloudStore(SLOT_CLOUD.auto), manual:makeCloudStore(SLOT_CLOUD.manual)};
function withTimeout(promise,ms){ return Promise.race([promise,new Promise(res=>setTimeout(()=>res(null),ms))]); }

let localTimer=null, booted=false;
function setSaveBadge(t){ const b=document.getElementById('saveBadge'); if(b) b.textContent=t; }
let lastSaveLabel='';
/* Единственная точка записи: снимок → устройство → облако (та же строка). */
function writeSave(slot){
  if(!booted||view==='battle') return false;
  const str=serializeGame();
  LocalStore.save(slot,str);
  lastSavedPrint=progressPrint(); syncClosingGuard();
  lastSaveLabel=`день ${day}`;
  if(CLOUD_OK){ setSaveBadge('☁️…'); CloudSlots[slot].save(str); } else setSaveBadge(`💾 ${lastSaveLabel}`);
  return true;
}
/* Локально — почти сразу (0.3 с), в облако — реже (4 с тишины), immediate — для важных моментов. */
/* «Отпечаток» прогресса: если он отличается от сохранённого — есть что терять, и при закрытии спросим подтверждение. */
let lastSavedPrint='';
function progressPrint(){
  return JSON.stringify([curCont,hero&&hero.row,hero&&hero.col,gold,day,movesLeft,army.map(a=>a.hp),inventory.length,equipment,
    spellCharges,workers,stats.battlesWon+stats.battlesLost+stats.retreats,stats.chestsOpened,stats.forestCut+stats.rocksBroken+stats.bridgesBuilt,mapPieces]);
}
function syncClosingGuard(){
  const dirty=booted && !hardMode && !gameOverPermanent && progressPrint()!==lastSavedPrint;
  const tg=window.Telegram&&window.Telegram.WebApp;
  if(tg&&tg.initData){ try{ dirty?tg.enableClosingConfirmation():tg.disableClosingConfirmation(); }catch(e){} }
  window.__morveynDirty=dirty;
}
window.addEventListener('beforeunload',e=>{ if(window.__morveynDirty){ e.preventDefault(); e.returnValue=''; } });
/* Автосохранение: immediate — сразу (утро, плавание, новая игра); иначе пишет только жёсткий режим, с паузой 1 с. */
function saveSoon(immediate){
  if(!booted) return;
  if(!immediate && !hardMode){ syncClosingGuard(); return; } // обычный режим: только явные точки сохранения
  clearTimeout(localTimer);
  if(immediate) writeSave('auto'); else localTimer=setTimeout(()=>writeSave('auto'),1000);
}
function flushSaves(){ if(!booted||!hardMode) return; clearTimeout(localTimer); writeSave('auto'); }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushSaves(); else lastTick=Date.now(); });
window.addEventListener('pagehide',flushSaves);
setInterval(()=>{ if(booted) tickPlaytime(); },15000);

/* ================= STATS VIEW ================= */
function fmtNum(n){ return Math.round(n).toLocaleString('ru-RU'); }
function fmtTime(ms){ const m=Math.floor(ms/60000), h=Math.floor(m/60); return h?`${h} ч ${m%60} мин`:`${m} мин`; }
function totalDays(){ return day; }
function openStats(victory){
  tickPlaytime();
  if(view!=='battle') showView('stats');
  const S=stats, lands=worlds.filter(Boolean).length, pieces=worlds.filter(Boolean).reduce((a,w)=>a+(w===worlds[curCont]?mapPieces:w.mapPieces),0);
  const castles=capturedTotal(), armyPow=power(activeStacks().concat(reserveStacks()).map(a=>({key:a.key,count:Math.ceil(a.hp/UNITS[a.key].hp)})),false);
  const cell=(v,l)=>`<div class="statCell"><div class="sv">${v}</div><div class="sl">${l}</div></div>`;
  const facts=[];
  const km=Math.round((S.tilesWalked+S.tilesSailed)*3.5);
  if(km>0) facts.push(`🥾 Если считать клетку за 3,5 км, вы преодолели около <b>${fmtNum(km)} км</b>${km>2000?' — больше, чем от Варшавы до Мадрида':km>700?' — как от Варшавы до Берлина и обратно':''}.`);
  if(S.forestCut>0) facts.push(`🪓 Вырубленного леса хватило бы на <b>${fmtNum(S.forestCut*40)}</b> брёвен для частокола.`);
  if(S.enemiesSlain>0&&S.troopsLost>0) facts.push(`⚖️ На каждого павшего вашего воина пришлось <b>${(S.enemiesSlain/S.troopsLost).toFixed(1)}</b> поверженных врагов.`);
  else if(S.enemiesSlain>0) facts.push(`🛡️ Вы сразили <b>${fmtNum(S.enemiesSlain)}</b> врагов, не потеряв ни одного воина. Легендарно.`);
  if(S.sorcererCaught>0) facts.push(`🌑 Чёрный Колдун настигал вас <b>${S.sorcererCaught}</b> раз${S.sorcererCaught%10>=2&&S.sorcererCaught%10<=4&&(S.sorcererCaught<10||S.sorcererCaught>20)?'а':''}.`);
  else facts.push('🌑 Чёрный Колдун так ни разу вас и не настиг.');
  if(S.goldEarned>0) facts.push(`💰 Через ваши руки прошло <b>${fmtNum(S.goldEarned)}</b> золотых; в казне осталось ${fmtNum(gold)}.`);
  document.getElementById('statsView').innerHTML=`
    <div class="cityCard">
      <h2>${victory?'🏆 Победа! Все пять земель покорены':(gameOverPermanent?'💀 Летопись павшего героя':'📊 Летопись похода')}</h2>
      ${victory?`<p style="font-size:13.5px;">Вы — владыка известного мира. Вот как это было:</p>`:''}
      <div class="statSection">Путь</div>
      <div class="statGrid">
        ${cell(fmtNum(S.tilesWalked),'клеток пройдено пешком')}
        ${cell(fmtNum(S.tilesSailed),'клеток под парусом')}
        ${cell(S.voyages,'дальних плаваний')}
        ${cell(`${lands}/5`,'земель открыто')}
        ${cell(totalDays(),'дней в пути')}
        ${cell(fmtTime(S.playMs),'времени за игрой')}
      </div>
      <div class="statSection">Работники</div>
      <div class="statGrid">
        ${cell(S.forestCut,'клеток леса вырублено')}
        ${cell(S.rocksBroken,'скал разрушено')}
        ${cell(S.bridgesBuilt,'мостов построено')}
      </div>
      <div class="statSection">Войны</div>
      <div class="statGrid">
        ${cell(S.battlesWon,'побед')}
        ${cell(S.battlesLost,'поражений')}
        ${cell(S.retreats,'отступлений')}
        ${cell(fmtNum(S.enemiesSlain),'врагов сражено')}
        ${cell(fmtNum(S.troopsLost),'своих воинов потеряно')}
        ${cell(fmtNum(S.strongestFoe),'сила сильнейшего врага')}
        ${cell(castles,'замков захвачено')}
        ${cell(`${pieces}/${lands*TOTAL_PIECES}`,'частей карт собрано')}
      </div>
      <div class="statSection">Герой и казна</div>
      <div class="statGrid">
        ${cell(heroCls().emoji+' '+heroCls().name,heroCls().title)}
        ${cell(heroLevel,'уровень героя')}
        ${cell(currentRank().name,'звание')}
        ${cell(fmtNum(armyPow),'сила армии сейчас')}
        ${cell(fmtNum(S.unitsRecruited),'воинов нанято')}
        ${cell(S.spellsCast,'заклинаний сотворено')}
        ${cell(S.chestsOpened,'сундуков открыто')}
        ${cell(S.questsDone||0,'поручений выполнено')}
        ${cell(S.scrollsRead,'свитков прочитано')}
        ${cell(fmtNum(S.goldEarned),'золота добыто')}
        ${cell(fmtNum(S.goldSpent),'золота потрачено')}
      </div>
      <div class="funFacts">${facts.join('<br>')}</div>
      <div style="margin-top:12px;">
        ${gameOverPermanent?`<button class="secondary" onclick="showView('gameover')">↩️ Назад</button>`:`<button onclick="showView('map');renderMap();">↩️ К карте</button>`}
        ${victory?`<button class="secondary" onclick="document.getElementById('restartBtn').click()">🔄 Новый мир</button>`:''}
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:8px;">Сохранение: ${CLOUD_OK?'облако Telegram + устройство':'на этом устройстве'}.</div>
    </div>`;
}
document.getElementById('statsBtn').onclick=()=>{ if(view==='battle') return; closeModal(); openStats(false); };

function saveInfo(str){ try{ const d=JSON.parse(str); return {savedAt:d.savedAt||0, day:d.day, cont:d.curCont, hard:!!d.hardMode}; }catch(e){ return null; } }
/* Для каждой ячейки берём более свежую из двух копий (устройство / облако). */
async function readSlot(slot){
  const local=LocalStore.load(slot);
  let cloud=null;
  if(CLOUD_OK){ try{ cloud=await withTimeout(CloudSlots[slot].load(),5000); }catch(e){ cloud=null; } }
  const ok=[local,cloud].filter(x=>x&&saveInfo(x));
  ok.sort((a,b)=>saveInfo(b).savedAt-saveInfo(a).savedAt);
  return ok[0]||null;
}
async function readAllSlots(){ const [auto,manual]=await Promise.all([readSlot('auto'),readSlot('manual')]); return {auto,manual}; }
async function readBestSave(){
  const {auto,manual}=await readAllSlots();
  return [auto,manual].filter(Boolean).sort((a,b)=>saveInfo(b).savedAt-saveInfo(a).savedAt);
}
function clearManualSave(){ LocalStore.clear('manual'); if(CLOUD_OK) CloudSlots.manual.clear(); }
function updateSaveButtons(){
  const sb=document.getElementById('saveBtn'), lb=document.getElementById('loadBtn');
  if(sb) sb.style.display=hardMode?'none':'';
  if(lb) lb.style.display=hardMode?'none':'';
}
document.getElementById('saveBtn').onclick=()=>{
  if(hardMode||view==='battle') return;
  closeModal();
  if(view!=='map'){ showView('map'); renderMap(); }
  writeSave('manual'); track('save',{});
  setInfo(`💾 Игра сохранена (день ${day}). Утреннее автосохранение эту запись не затрёт.`);
};
document.getElementById('loadBtn').onclick=()=>{
  if(hardMode||view==='battle') return;
  closeModal();
  if(view!=='map'){ showView('map'); renderMap(); }
  openLoadDialog();
};
let loadCache={};
function fmtSavedAt(ts){
  const d=new Date(ts), now=new Date(), same=d.toDateString()===now.toDateString();
  const hm=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  return same?`сегодня ${hm}`:`${d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})} ${hm}`;
}
async function openLoadDialog(){
  openModal(`<h2>📂 Загрузка</h2><div class="modalNote">⏳ Читаю сохранения...</div>`);
  loadCache=await readAllSlots();
  const row=(slot,label,hint)=>{
    const str=loadCache[slot], i=str&&saveInfo(str);
    if(!i) return `<button class="modeBtn secondary" disabled>${label}<small>пусто</small></button>`;
    const c=CONTINENTS[i.cont]||CONTINENTS[0];
    return `<button class="modeBtn secondary" onclick="loadSlot('${slot}')">${label}<small>${c.emoji} ${c.name}, день ${i.day} · ${fmtSavedAt(i.savedAt)} · ${hint}</small></button>`;
  };
  openModal(`<h2>📂 Загрузка</h2>
    <div class="modalNote">Всё, что произошло после выбранного сохранения, будет потеряно.</div>
    ${row('manual','💾 Ручное сохранение','кнопка «Сохранить»')}
    ${row('auto','🌅 Автосохранение','начало дня')}
    <button class="secondary" style="margin-top:10px;width:100%;" onclick="closeModal()">Отмена</button>`);
}
function loadSlot(slot){
  const str=loadCache[slot];
  if(!str||!restoreGame(str)){ openModal(`<h2>📂 Загрузка</h2><div class="modalNote">Не удалось прочитать сохранение.</div><button class="secondary" style="margin-top:10px;width:100%;" onclick="closeModal()">Закрыть</button>`); return; }
  closeModal(); track('load',{slot});
  curCity=null; curEncounter=null; currentWallBonus=0;
  lastSavedPrint=progressPrint(); syncClosingGuard();
  showView('map'); renderMap(); updateSaveButtons();
  setInfo(`📂 Загружено ${slot==='manual'?'ручное сохранение':'автосохранение'}: ${contCfg().emoji} ${contCfg().name}, день ${day}.`);
}

async function bootGame(){
  track('session_start',{screen:`${innerWidth}x${innerHeight}`,lang:navigator.language,returning:!!localStorage.getItem(SAVE_KEY),src:startSource()});
  showView('map'); layoutViewport();
  setInfo('⏳ Загрузка сохранения...');
  const cands=await readBestSave();
  let restored=false;
  for(const c of cands){ if(restoreGame(c)){ restored=true; break; } }
  if(!restored) startNewWorld();
  booted=true;
  lastSavedPrint=progressPrint();
  if(!restored) saveSoon(true); // первая точка сохранения нового мира
  updateSaveButtons();
  showView('map'); renderMap();
  if(!restored) openNewGame(true);
  if(gameOverPermanent){ triggerGameOver(gameOverReason||'Ваш герой пал в жёстком режиме.'); }
  else setInfo(restored?`📜 Сохранение загружено: ${contCfg().emoji} ${contCfg().name}, день ${day}, неделя ${week}.`:'Новый мир сгенерирован. Игра сохраняется в начале каждого дня; можно сохраниться и вручную.');
  if(!document.getElementById('saveBadge').textContent) setSaveBadge(CLOUD_OK?'☁️':'💾');
}

function startNewWorld(){
  worldSeed=Date.now(); worlds=[]; curCont=0; unlocked=[true,false,false,false,false];
  const w=loadWorld(0);
  hero={row:w.CITY1.r,col:w.CITY1.c};
}
bootGame();
</script>
